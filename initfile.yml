# initfile spec
version: "0.2.0"

# an initfile defines services that are run either by the daemon in the background or temporarily
# by the current terminal process in the foreground
#
# these services, at their core, are a set of commands that get run at their own defined times.
#
# the 'setup' service lists commands that get run when the user jumps to a project. they are run in
# the background by the daemon, and either stop when you leave the project or when you stop them
# manually

setup:
  jekyll: # this is a service item, specifically run on 'setup'
    cmd: "jekyll" # define the command that this item runs
    args: # define args that should get passed to the item's command. (maybe grab from terminal?)
      - "serve"

# the 'demand' service lists commands that are only run when the user requests. they run in the
# foreground, and must be stopped before you can continue working (unless you run it in a seperate
# terminal instance)

demand:
  test:
    cmd: "cargo"
    args:
      - "test"
      - "-v"

# the 'close' service lists commands that get run when the user:
# - calls the service manually
# - jumps to another project
# - 'cd'-s out of the project directory
#
# beyond the user-defined tasks listed, the 'close' service also kills the processes started by the
# 'setup' service
#
# tasks that rely on other tasks must be defined after them (change this?)

close:
  git-add:
    cmd: "git"
    args:
      - "src/"

  git-commit:
    cmd: "git"
    args:
      - "commit"
      - "-m"
      - INPUT_REQUIRED="enter commit message"
  
  git-push:
    cmd: "git"
    args:
      - "push"
